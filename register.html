<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen py-8 flex items-center justify-center">
    <div class="container mx-auto max-w-lg px-4">
        <!-- En-tête -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🔐 Créer un compte</h1>
            <p class="text-gray-600">Rejoignez-nous en quelques étapes simples</p>
        </header>

        <!-- Formulaire -->
        <form id="register-form" method="post" class="bg-white rounded-lg shadow-md p-6" novalidate
            aria-label="Formulaire d'inscription">

            <!-- Nom d'utilisateur -->
            <div class="mb-6">
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                    Nom d'utilisateur <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <input type="text" id="username" name="username"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Entre 3 et 20 caractères" aria-required="true" aria-describedby="username-error"
                    autocomplete="username">
                <div id="username-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Email -->
            <div class="mb-6">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Adresse email <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <input type="email" id="email" name="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="votre@email.com" aria-required="true" aria-describedby="email-error"
                    autocomplete="email">
                <div id="email-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Mot de passe -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Mot de passe <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password"
                        class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="8 caractères min, avec majuscule, minuscule et chiffre" aria-required="true"
                        aria-describedby="password-error" autocomplete="new-password">
                    <button type="button" id="toggle-password"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none focus:text-gray-600"
                        aria-label="Afficher le mot de passe">
                        <span id="eye-icon">👁️</span>
                    </button>
                </div>
                <div id="password-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Confirmation mot de passe -->
            <div class="mb-6">
                <label for="repeatPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                    Confirmer le mot de passe <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <div class="relative">
                    <input type="password" id="repeatPassword" name="repeatPassword"
                        class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Répétez votre mot de passe" aria-required="true"
                        aria-describedby="repeatPassword-error" autocomplete="new-password">
                    <button type="button" id="toggle-repeat-password"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none focus:text-gray-600"
                        aria-label="Afficher le mot de passe">
                        <span id="eye-icon-repeat">👁️</span>
                    </button>
                </div>
                <div id="repeatPassword-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite">
                </div>
            </div>


            <!-- Checkbox RGPD -->
            <div class="mb-6">
                <div class="flex items-start">
                    <input type="checkbox" id="rgpd" name="rgpd"
                        class="mt-1 h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                        aria-required="true" aria-describedby="rgpd-error">
                    <label for="rgpd" class="ml-2 block text-sm text-gray-700">
                        J'accepte les <a href="#" class="text-blue-600 underline hover:text-blue-800">conditions
                            d'utilisation</a>
                        et la <a href="#" class="text-blue-600 underline hover:text-blue-800">politique de
                            confidentialité</a>
                        <span class="text-red-500" aria-label="requis">*</span>
                    </label>
                </div>
                <div id="rgpd-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Bouton submit -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                🚀 Créer mon compte
            </button>
        </form>

        <!-- Message de succès (caché par défaut) -->
        <div id="success" class="mt-6 bg-green-50 border border-green-200 text-green-800 p-4 rounded-md hidden"
            role="alert">
            <div class="flex items-center">
                <span class="text-xl mr-3">✅</span>
                <div>
                    <h3 class="font-semibold">Compte créé avec succès !</h3>
                    <p class="text-sm mt-1">Vous pouvez maintenant vous connecter.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="js/forms/register-validation.js"></script>
</body>

</html>
