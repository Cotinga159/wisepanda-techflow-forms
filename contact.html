<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen py-8 flex items-center justify-center">
    <div class="container mx-auto max-w-lg px-4">
        <!-- En-tête -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📧 Nous contacter</h1>
            <p class="text-gray-600">Envoyez-nous votre message, nous vous répondrons rapidement</p>
        </header>

        <!-- Formulaire -->
        <form id="contact-form" method="post" class="bg-white rounded-lg shadow-md p-6" novalidate
            aria-label="Formulaire de contact">
            <!-- Nom -->
            <div class="mb-6">
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
                    Nom complet <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <input type="text" id="name" name="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Votre nom et prénom" aria-required="true" aria-describedby="name-error"
                    autocomplete="name">
                <div id="name-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Email -->
            <div class="mb-6">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Adresse email <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <input type="email" id="email" name="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="votre@email.com" aria-required="true" aria-describedby="email-error"
                    autocomplete="email">
                <div id="email-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Sujet -->
            <div class="mb-6">
                <label for="subject" class="block text-sm font-semibold text-gray-700 mb-2">
                    Sujet <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <select id="subject" name="subject"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    aria-required="true" aria-describedby="subject-error">
                    <option value="">-- Choisir un sujet --</option>
                    <option value="question">Question générale</option>
                    <option value="support">Support technique</option>
                    <option value="commercial">Demande commerciale</option>
                    <option value="autre">Autre</option>
                </select>
                <div id="subject-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Message -->
            <div class="mb-6">
                <label for="message" class="block text-sm font-semibold text-gray-700 mb-2">
                    Message <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <textarea id="message" name="message" rows="5"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Décrivez votre demande en détail (minimum 10 caractères)" aria-required="true"
                    aria-describedby="message-error"></textarea>
                <div id="message-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Bouton submit -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                📤 Envoyer le message
            </button>
        </form>

        <!-- Message de succès (caché par défaut) -->
        <div id="success" class="mt-6 bg-green-50 border border-green-200 text-green-800 p-4 rounded-md hidden"
            role="alert">
            <div class="flex items-center">
                <span class="text-xl mr-3">✅</span>
                <div>
                    <h3 class="font-semibold">Message envoyé avec succès !</h3>
                    <p class="text-sm mt-1">Nous vous répondrons dans les plus brefs délais.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript sera ajouté ici -->
    <script type="module" src="js/forms/contact-validation.js"></script>
</body>

</html>
