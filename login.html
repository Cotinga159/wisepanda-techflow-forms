<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mon Site</title>
    <meta name="description" content="Connectez-vous à votre compte">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- En-tête -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">🔐 Connexion</h1>
            <p class="text-gray-600">Connectez-vous à votre compte</p>
        </div>

        <!-- Formulaire de connexion -->
        <form id="login-form" class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow-md" novalidate>
            <!-- Identifiant (email ou username) -->
            <div class="mb-6">
                <label for="identifier" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email ou nom d'utilisateur <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <input type="text" id="identifier" name="identifier"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Votre email ou nom d'utilisateur" aria-required="true"
                    aria-describedby="identifier-error" autocomplete="username">
                <div id="identifier-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite">
                </div>
            </div>

            <!-- Mot de passe -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Mot de passe <span class="text-red-500" aria-label="requis">*</span>
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password"
                        class="w-full px-3 py-2 pr-12 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Votre mot de passe" aria-required="true" aria-describedby="password-error"
                        autocomplete="current-password">
                    <button type="button" id="toggle-password"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none focus:text-gray-600"
                        aria-label="Afficher le mot de passe">
                        <span id="eye-icon">👁️</span>
                    </button>
                </div>
                <div id="password-error" class="mt-1 text-sm text-red-600 hidden" role="alert" aria-live="polite">
                </div>
            </div>

            <!-- Options de connexion -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-700">
                        Se souvenir de moi
                    </label>
                </div>
                <div class="text-sm">
                    <a href="#" class="text-blue-600 hover:text-blue-800 underline">
                        Mot de passe oublié ?
                    </a>
                </div>
            </div>

            <!-- Bouton de connexion -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                🚀 Se connecter
            </button>

            <!-- Lien vers inscription -->
            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">
                    Pas encore de compte ?
                    <a href="register.html" class="text-blue-600 hover:text-blue-800 underline font-semibold">
                        Créer un compte
                    </a>
                </p>
            </div>
        </form>

        <!-- Message de succès (caché par défaut) -->
        <div id="success" class="mt-6 bg-green-50 border border-green-200 text-green-800 p-4 rounded-md hidden"
            role="alert">
            <div class="flex items-center">
                <span class="text-xl mr-3">✅</span>
                <div>
                    <h3 class="font-semibold">Connexion réussie !</h3>
                    <p class="text-sm mt-1">Vous êtes maintenant connecté.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="js/forms/login-validation.js"></script>
</body>

</html>
